<style>
:root{--bg:#f4f3ff;--card:#fff;--tx:#1b1a3a;--mu:#5d5c80;--pr:#4f46e5;--pr2:#6366f1;--ac:#f97316;--gn:#10b981;--bd:#e3e1f7;--sh:0 6px 24px rgba(79,70,229,.10);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0e24;--card:#1a1940;--tx:#ecebff;--mu:#a9a8cf;--bd:#2d2b5e;--pr:#818cf8;--sh:0 6px 24px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f0e24;--card:#1a1940;--tx:#ecebff;--mu:#a9a8cf;--bd:#2d2b5e;--pr:#818cf8;--sh:0 6px 24px rgba(0,0,0,.4);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 "Segoe UI","Noto Sans Devanagari",system-ui,sans-serif}
h1,h2,h3{font-family:Georgia,"Noto Serif Devanagari",serif;line-height:1.2;margin:0 0 .5em}
a{color:var(--pr)}button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.layout{display:flex;min-height:100vh}
aside{width:230px;background:var(--card);border-right:1px solid var(--bd);padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;text-decoration:none;color:var(--tx);margin-bottom:14px}
nav a.nl{display:block;padding:10px 12px;border-radius:12px;text-decoration:none;color:var(--mu);font-weight:600}
nav a.nl:hover{background:var(--bg)}nav a.nl.on{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff}
main{flex:1;min-width:0;padding:24px clamp(14px,4vw,40px) 40px;max-width:1100px}
.top{display:none;position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 14px;align-items:center;justify-content:space-between}
@media(max-width:800px){aside{display:none;position:fixed;z-index:9;inset:0 30% 0 0;width:auto;height:auto}aside.open{display:flex}.top{display:flex}}
.btn{border:0;border-radius:999px;padding:11px 22px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;text-decoration:none;display:inline-block}
.btn.o{background:transparent;color:var(--pr);border:2px solid var(--pr)}.btn.a{background:var(--ac)}.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:18px;box-shadow:var(--sh)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.pick{cursor:pointer;text-align:center;font-weight:700;padding:18px 10px;border:2px solid var(--bd);background:var(--card);border-radius:18px;transition:.15s}
.pick:hover,.pick.sel{border-color:var(--pr);transform:translateY(-2px)}
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:24px;align-items:center;background:linear-gradient(135deg,#eef0ff,#e0e4ff);border-radius:28px;padding:clamp(20px,4vw,44px);position:relative;overflow:hidden;color:#1b1a3a}
:root[data-theme="dark"] .hero{background:linear-gradient(135deg,#25236b,#1a1940);color:#ecebff}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero{background:linear-gradient(135deg,#25236b,#1a1940);color:#ecebff}}
.hero h1{font-size:clamp(30px,5vw,50px)}.btns{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.art{position:relative;height:260px}.art i{position:absolute;display:block}
.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:var(--card);color:var(--tx);border-radius:16px;padding:10px 16px;box-shadow:var(--sh)}.stat b{display:block;font-size:22px;color:var(--pr)}
@media(max-width:800px){.hero{grid-template-columns:1fr}.art{height:170px}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
select,input[type=text],textarea{background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:10px 12px;min-width:0}
textarea{width:100%;min-height:90px}input[type=text]{flex:1;min-width:160px}
.note{border-left:5px solid var(--ac);background:rgba(249,115,22,.1);padding:12px 14px;border-radius:10px;margin:12px 0}
.mu{color:var(--mu)}.tag{font-size:12px;font-weight:700;background:var(--bg);border:1px solid var(--bd);border-radius:99px;padding:2px 10px;color:var(--mu)}
.timer{font:800 24px/1 ui-monospace,monospace;color:var(--pr)}.timer.low{color:#e11d48}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.pal button{height:42px;border-radius:10px;border:2px solid var(--bd);background:var(--card);font-weight:700;cursor:pointer}
.pal .ans{background:var(--gn);color:#fff;border-color:var(--gn)}.pal .rev{background:#a855f7;color:#fff;border-color:#a855f7}.pal .nans{background:#fb7185;color:#fff;border-color:#fb7185}.pal .cur{outline:3px solid var(--ac)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border:2px solid var(--bd);border-radius:14px;background:var(--card);cursor:pointer}
.opt.sel{border-color:var(--pr);background:rgba(99,102,241,.14)}.opt.ok{border-color:var(--gn);background:rgba(16,185,129,.15)}.opt.bad{border-color:#e11d48;background:rgba(225,29,72,.12)}
.cols{display:grid;grid-template-columns:1fr 280px;gap:16px}@media(max-width:800px){.cols{grid-template-columns:1fr}}
dialog{border:0;border-radius:20px;padding:22px;background:var(--card);color:var(--tx);max-width:90vw;box-shadow:var(--sh)}dialog::backdrop{background:rgba(0,0,0,.5)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1b1a3a;color:#fff;padding:12px 20px;border-radius:14px;z-index:99;display:none;max-width:90vw}
details{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 16px;margin:8px 0}summary{cursor:pointer;font-weight:700}
footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--bd);color:var(--mu);font-size:14px}footer a{margin-right:14px}
.bar{height:10px;border-radius:9px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pr),var(--gn))}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.fade{animation:f .3s}@keyframes f{from{opacity:0;transform:translateY(6px)}}

$("#sb2").onclick=()=>{const d=$("#dlg");d.innerHTML=`<h3>Submit test?</h3><p>Answered ${Object.keys(a.ans).length} of ${n}. You cannot change answers after submitting.</p><div class="row"><button class="btn" id="y">Yes, submit</button><button class="btn o" id="no">Keep going</button></div>`;d.showModal();$("#y").onclick=()=>{d.close();finish(a)};$("#no").onclick=()=>d.close()}}
draw();clearInterval(tick);tick=setInterval(()=>{const l=a.deadline-Date.now(),t=$("#tm");if(l<=0){clearInterval(tick);toast("Time is up — your test was submitted automatically.");return finish(a,true)}if(t){t.textContent=fmt(l);t.classList.toggle("low",l<300000)}for(const m of[10,5,1])if(l<=m*60000&&!a.w[m]){a.w[m]=1;save();toast(`⏰ ${m} minute${m>1?"s":""} remaining`)}},1000)}
async function finish(a,auto){clearInterval(tick);if(finish.l)return;finish.l=1;LS("eg_active",null);view("<p>Checking your answers…</p>");let c=0,w=0;const cor=[],exp=[];for(let i=0;i<a.items.length;i++){const q=a.items[i],ci=await solve(q);cor[i]=ci;exp[i]=await dec(q,ci);if(a.ans[i]!==undefined)a.ans[i]===ci?c++:w++}finish.l=0;const n=a.qs.length,att=c+w,pct=Math.round(c/n*100),took=Math.min(Date.now(),a.deadline)-a.start;
const hist=LS("eg_hist")||[];if(!hist.find(x=>x.id==a.id))hist.unshift({id:a.id,cls:a.cls,sub:a.sub,score:c,max:n,pct,date:new Date().toLocaleDateString()});LS("eg_hist",hist.slice(0,50));
view(`<h1>Test Results</h1>${auto?`<div class="note">This test was auto-submitted at the deadline.</div>`:""}<div class="card"><h2>${c} / ${n} <span class="mu">(${pct}%)</span></h2><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr))"><div>Total: <b>${n}</b></div><div>Attempted: <b>${att}</b></div><div>Correct: <b style="color:var(--gn)">${c}</b></div><div>Incorrect: <b style="color:#e11d48">${w}</b></div><div>Unanswered: <b>${n-att}</b></div><div>Time taken: <b>${fmt(took)}</b></div></div></div>
<h2 style="margin-top:20px">Answer review</h2>${a.items.map((q,i)=>{return`<div class="card" style="margin:10px 0"><b>Q${i+1}. ${esc(q.q)}</b>${q.o.map((o,j)=>`<div class="opt ${j==cor[i]?"ok":a.ans[i]===j?"bad":""}">${"ABCD"[j]}. ${esc(o)} ${j==cor[i]?"✓":a.ans[i]===j?"✗ (your answer)":""}</div>`).join("")}<p class="mu">${a.ans[i]===undefined?"Not answered. ":""}${esc(exp[i])}</p></div>`}).join("")}
<div class="row"><button class="btn" id="rt">Retry</button><a class="btn o" href="#/tests" id="nt">Other tests</a></div>`);
S={cls:a.cls,sub:a.sub,ch:"all",diff:S.diff,step:3};$("#rt").onclick=()=>{S.step=3;tests()};$("#nt").onclick=()=>{S.step=0}}
function dash(){const h=LS("eg_hist")||[],avg=h.length?Math.round(h.reduce((s,x)=>s+x.pct,0)/h.length):0,by={};h.forEach(x=>(by[x.sub]=by[x.sub]||[]).push(x.pct));
view(`<h1>My Progress</h1><div class="note">Progress is saved only in this browser. Accounts, cross-device history and password reset need the server version.</div><div class="stats"><div class="stat"><b>${h.length}</b>Tests taken</div><div class="stat"><b>${avg}%</b>Average</div></div>
<h2 style="margin-top:20px">Subject-wise</h2>${Object.keys(by).map(s=>{const v=Math.round(by[s].reduce((a,b)=>a+b,0)/by[s].length);return`<p>${esc(s)} — ${v}%</p><div class="bar"><i style="width:${v}%"></i></div>`}).join("")||`<p class="mu">Take a test to see progress.</p>`}
<h2 style="margin-top:20px">History</h2>${h.map(x=>`<div class="card" style="margin:8px 0">${x.date} · ${esc(x.sub)} (Class ${x.cls}) — <b>${x.score}/${x.max}</b></div>`).join("")||`<p class="mu">No attempts yet.</p>`}
${h.length?`<button class="btn o" id="ch">Clear history</button>`:""}${foot}`);$("#ch")&&($("#ch").onclick=()=>{LS("eg_hist",null);dash()})}
function help(){view(`<h1>About, FAQ & Policies</h1><p>EduGenius AI helps students in Classes 1–12 practise with timed mock tests and a bilingual dictionary.</p>
<details><summary>Is the AI tutor working?</summary><p>No. It needs a server-side API key; this edition shows an honest setup notice instead.</p></details>
<details><summary>Is the question bank complete?</summary><p>No. It holds a small set of sample questions that are not officially verified. Admins would import teacher-reviewed banks (CSV/JSON) in the full version.</p></details>
<details><summary>How secure is the test timer?</summary><p>The deadline and the answers are checked inside your browser. Answer keys are stored only as scrambled hashes and are matched when you submit, but a technically skilled person could still break this. Truly secret answer keys and server-enforced deadlines need the backend version.</p></details>
<details><summary>Privacy</summary><p>This edition has no accounts and sends nothing to any server. Tests, history and recent searches are kept in your browser’s local storage; clear them from My Progress. Voice input uses your browser’s speech service, which may send your audio to its provider (for example Google in Chrome); nothing is sent to EduGenius.</p></details>
<details><summary>Terms</summary><p>Content is for practice only, may contain errors, and is not an official board resource.</p></details>
<details><summary>Contact</summary><p>No contact form is connected yet; add your support email in the full version.</p></details>${foot}`)}
